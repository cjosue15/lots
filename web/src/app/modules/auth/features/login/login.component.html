@let isPasswordVisible = passwordVisible();

<main class="flex min-h-dvh items-center justify-center px-4 py-10">
  <section hlmCard class="w-full max-w-[400px] shadow-sm">
    <div hlmCardHeader>
      <p class="mb-3 flex items-center gap-2 font-semibold">
        <img ngSrc="logo.png" width="472" height="285" alt="" priority class="h-10 w-auto" />
        Oro Verde
      </p>
      <h1 hlmCardTitle>Ingresa a tus lotes</h1>
      <p hlmCardDescription>Usa el correo y la contraseña de tu cuenta.</p>
    </div>

    <div hlmCardContent>
      <form [formGroup]="form" (ngSubmit)="submit()" novalidate>
        <hlm-field-group>
          <hlm-field>
            <label hlmFieldLabel for="login-email">Correo</label>
            <input
              hlmInput
              id="login-email"
              type="email"
              inputmode="email"
              formControlName="email"
              autocomplete="username"
              class="h-11 text-base"
            />
            <hlm-field-error validator="required">Escribe tu correo.</hlm-field-error>
            <hlm-field-error validator="email">Revisa el formato del correo.</hlm-field-error>
          </hlm-field>

          <hlm-field>
            <label hlmFieldLabel for="login-password">Contraseña</label>
            <div class="relative">
              <input
                hlmInput
                id="login-password"
                [type]="isPasswordVisible ? 'text' : 'password'"
                formControlName="password"
                autocomplete="current-password"
                class="h-11 pr-11 text-base"
              />
              <button
                type="button"
                class="absolute inset-y-0 right-0 flex w-11 items-center justify-center rounded-r-md text-muted-foreground hover:text-foreground focus-visible:ring-3 focus-visible:ring-ring/50 focus-visible:outline-none"
                [attr.aria-label]="isPasswordVisible ? 'Ocultar contraseña' : 'Mostrar contraseña'"
                [attr.aria-pressed]="isPasswordVisible"
                (click)="passwordVisible.set(!isPasswordVisible)"
              >
                <ng-icon [name]="isPasswordVisible ? 'lucideEyeOff' : 'lucideEye'" size="18" />
              </button>
            </div>
            <hlm-field-error validator="required">Escribe tu contraseña.</hlm-field-error>
          </hlm-field>
        </hlm-field-group>

        <button hlmBtn type="submit" class="mt-6 h-11 w-full text-base" [disabled]="submitting()">
          @if (submitting()) {
            <hlm-spinner aria-label="Ingresando" />
          }
          Ingresar
        </button>
      </form>

      <p class="mt-6 text-sm text-muted-foreground">
        ¿Olvidaste tu contraseña? Pide al administrador que la restablezca.
      </p>
    </div>
  </section>
</main>
